<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="robots" content="noindex, nofollow">
<title>OTP</title>
<style>
/* Styled in the Jarvis "machined instrument" language (~/jarvis/frontend/src/styles/tokens.css),
   like Recipie and Foodlog. Fonts are the projects page's, served by nginx at /fonts/. */
@font-face { font-family: "Archivo"; src: url(/fonts/archivo.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url(/fonts/plexmono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url(/fonts/plexmono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }

:root {
  color-scheme: dark;
  --ground: #0a0e14; --panel: #111823; --panel-lit: #16202e; --engrave: #2a3543;
  --ink: #e8f1f8; --ink-dim: #7c8fa3; --arc: #3dd6f5; --arc-dim: #1d7f96;
  --gold: #e8a33d; --alert: #ff4d4d; --slate: #55647a; --slate-dim: #3a4657;
  /* Phone liveness. Down is the one bad state: OTPs are not arriving. Shown as
     "not reporting", not "silent" or "offline": silent reads as the ringer mode,
     and offline is already this page's own connection status. */
  --ok: var(--arc); --late: var(--gold); --down: var(--alert); --unknown: var(--slate);
  --face-data: "Archivo", system-ui, sans-serif; --face-mono: "Plex Mono", ui-monospace, monospace;
  --t-hero: clamp(3.25rem, 17vw, 5.5rem); --t-readout: clamp(1.375rem, 5.5vw, 1.875rem);
  --t-body: 1rem; --t-label: 0.8125rem; --t-min: 0.75rem;
  --rule: 2px; --gap: 1rem; --pad: 1.25rem; --bracket: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
}
/* Fetch failing: keep the last list visible, but stop it reading as live. */
:root[data-connection="offline"] { --arc: var(--slate); --arc-dim: var(--slate-dim); --ink: #b9c4d1; }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 var(--t-body)/1.4 var(--face-data);
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 54rem; margin: 0 auto;
  padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
           max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
}
header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--gap); }
.wordmark { font: 500 var(--t-label) var(--face-mono); letter-spacing: 0.3em; text-transform: uppercase; }
.label { font: 500 var(--t-label) var(--face-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--arc-dim); }
.stamp { font: 400 var(--t-min) var(--face-mono); letter-spacing: 0.08em; color: var(--ink-dim); }
.status::before {
  content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; margin-right: 0.5rem;
  background: var(--arc); vertical-align: 0.05em;
}
:root[data-connection="offline"] .status::before { background: var(--gold); }

.instrument { position: relative; background: var(--panel); padding: var(--pad); }
.instrument::before, .instrument::after {
  content: ""; position: absolute; width: var(--bracket); height: var(--bracket);
  border: var(--rule) solid var(--engrave); pointer-events: none;
}
.instrument::before { top: 0; left: 0; border-right: none; border-bottom: none; }
.instrument::after { bottom: 0; right: 0; border-left: none; border-top: none; }

/* Public demo only (the API says so): gold, the colour for "not the real thing". */
#demo { background: var(--panel); border-left: 4px solid var(--gold); padding: 0.75rem var(--pad); margin-bottom: var(--gap); }
#demo .label { color: var(--gold); margin-right: 0.5rem; }
#demo a, .status a { color: var(--arc); }

/* The phone: is it still forwarding? A callout with the state in its left border and dot. */
#phone {
  display: flex; justify-content: space-between; align-items: center; gap: var(--gap); flex-wrap: wrap;
  background: var(--panel); border-left: 4px solid var(--state, var(--unknown));
  padding: 0.75rem var(--pad); margin-bottom: var(--gap); min-height: 56px;
}
#phone .dot { display: inline-block; width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--state, var(--unknown)); margin-right: 0.625rem; }
#phone .state { font: 500 var(--t-label) var(--face-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--state, var(--unknown)); }
/* The advice for a lost phone goes on its own line, after the facts. */
#phone-detail { white-space: pre-line; }
#phone[data-state="ok"] { --state: var(--ok); }
#phone[data-state="late"] { --state: var(--late); }
#phone[data-state="down"] { --state: var(--down); }

/* The latest code: the one thing this page exists to show. A button, so a tap copies it. */
#latest { display: block; width: 100%; border: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
#latest:hover { background: var(--panel-lit); }
#latest .code {
  font: 600 var(--t-hero)/0.92 var(--face-data); letter-spacing: 0.04em; color: var(--arc);
  margin: 0.75rem 0; word-break: break-all;
}
/* Past ten minutes a code has almost certainly expired: dim it rather than let it look usable. */
#latest.stale { opacity: 0.34; }
#latest.empty .code { color: var(--slate); font-size: var(--t-readout); }
#latest .meta { display: flex; justify-content: space-between; gap: var(--gap); }
#latest .meta .label { white-space: nowrap; }
#latest .meta .stamp { text-align: right; }
.copied { color: var(--gold) !important; }

h2 { margin: calc(var(--gap) * 2) 0 0.5rem; }
ol { list-style: none; margin: 0; padding: 0; }
li { border-top: var(--rule) solid var(--engrave); padding: 0.875rem 0; min-height: 64px; }
li .row { display: flex; justify-content: space-between; gap: var(--gap); align-items: baseline; }
li .from { font-weight: 600; font-size: 1.0625rem; }
li .otp {
  font: 500 var(--t-readout)/1.05 var(--face-data); color: var(--arc);
  background: none; border: 0; padding: 0; cursor: pointer; min-height: 44px;
}
li .text { color: var(--ink-dim); margin-top: 0.25rem; overflow-wrap: anywhere; }
li.old { opacity: 0.6; }

:focus-visible { outline: var(--rule) solid var(--arc); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="wordmark">OTP</span>
    <span class="stamp status" id="status">Connecting to server</span>
  </header>

  <p id="demo" hidden><span class="label">Demo</span>Made-up messages: a new code arrives every few minutes and nothing you do here is stored.
    <a href="https://github.com/anishanilkumar/sms-otp-inbox">Source and setup</a></p>

  <section id="phone" data-state="unknown" aria-live="polite">
    <span><span class="dot"></span><span class="state" id="phone-state">Phone</span></span>
    <span class="stamp" id="phone-detail">First check-in due within 5 min</span>
  </section>

  <button class="instrument" id="latest" type="button">
    <div class="meta"><span class="label">Latest code</span><span class="stamp" id="latest-age"></span></div>
    <div class="code" id="latest-code">No codes yet</div>
    <div class="meta"><span id="latest-from"></span><span class="stamp" id="latest-hint"></span></div>
  </button>

  <h2 class="label">Messages</h2>
  <ol id="list"></ol>
</main>

<script>
const FRESH_MS = 10 * 60 * 1000;
const NETWORK = { wifi: "Wi-Fi", mobile: "Mobile data", ethernet: "Ethernet", none: "No network" };
let lastOk = 0, data = null;
// Which code was just copied, and until when to say so. Kept outside the DOM
// because the page re-renders every poll, which would wipe a flash set on an element.
let copied = { code: null, until: 0 };

function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + " s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

function copy(code) {
  navigator.clipboard?.writeText(code).then(() => {
    copied = { code, until: Date.now() + 1500 };
    render();
    setTimeout(render, 1600);
  });
}

const justCopied = code => copied.code === code && Date.now() < copied.until;

function renderPhone(now) {
  const p = data.phone || {};
  const hb = Number(p.heartbeat_ms) || 0, sms = Number(p.sms_ms) || 0;
  const seen = Math.max(hb, sms), every = Number(p.heartbeat_interval_ms) || 300000;
  // One missed ping is noise (Doze, a lift, a tunnel); several mean the phone is off,
  // offline or the app was killed, and codes are not reaching this page.
  const age = now - seen;
  const state = !seen ? "unknown" : age <= 2 * every + 60000 ? "ok" : age <= 6 * every ? "late" : "down";
  const box = document.getElementById("phone");
  box.dataset.state = state;
  document.getElementById("phone-state").textContent = {
    ok: "Phone online", late: "Phone check-in late",
    down: "Lost contact with phone", unknown: "Waiting for phone",
  }[state];
  const mins = Math.round(every / 60000);
  const bits = [];
  if (!seen) bits.push("First check-in due within " + mins + " min");
  else if (state === "late") bits.push("Last check-in " + ago(age) + ", expected every " + mins + " min");
  else bits.push("Last check-in " + ago(age));
  // Battery and network only arrive with an SMS, so they can be far older than the
  // last check-in. Say how old when they are, rather than let them pass as current.
  const health = [];
  if (p.battery && p.battery !== "-1") health.push("Battery " + p.battery + "%" + (p.power && p.power !== "unplugged" && p.power !== "unknown" ? " charging" : ""));
  if (NETWORK[p.network]) health.push(NETWORK[p.network]);
  if (health.length) bits.push(health.join(", ") + (sms && now - sms > 2 * every ? " (" + ago(now - sms) + ")" : ""));
  document.getElementById("phone-detail").textContent = bits.join(" · ") +
    (state === "down" ? "\nCheck the phone: battery, signal, or the app was closed" : "");
}

function render() {
  if (!data) return;
  // Ages are measured on the server's clock plus the time since we heard from it,
  // so a phone with a wrong clock still shows honest ages.
  const now = data.now_ms + (Date.now() - lastOk);
  document.getElementById("demo").hidden = !data.demo;
  renderPhone(now);
  const latest = data.messages.find(m => m.otp);
  const box = document.getElementById("latest");
  box.classList.toggle("empty", !latest);
  box.classList.toggle("stale", !!latest && now - latest.received_ms > FRESH_MS);
  const latestAge = latest ? now - latest.received_ms : 0;
  document.getElementById("latest-code").textContent = latest ? latest.otp : "No codes yet";
  document.getElementById("latest-age").textContent =
    latest ? ago(latestAge) + (latestAge > FRESH_MS ? " · probably expired" : "") : "";
  document.getElementById("latest-from").textContent = latest ? latest.sender : "";
  const hint = document.getElementById("latest-hint");
  hint.textContent = !latest ? "" : justCopied(latest.otp) ? "Copied" : "Tap to copy";
  hint.classList.toggle("copied", !!latest && justCopied(latest.otp));

  const list = document.getElementById("list");
  list.replaceChildren(...data.messages.map(m => {
    const li = document.createElement("li");
    if (now - m.received_ms > FRESH_MS) li.className = "old";
    const row = document.createElement("div"); row.className = "row";
    const from = document.createElement("span"); from.className = "from"; from.textContent = m.sender;
    const when = document.createElement("span"); when.className = "stamp"; when.textContent = ago(now - m.received_ms);
    row.append(from, when);
    li.append(row);
    if (m.otp) {
      const b = document.createElement("button"); b.className = "otp"; b.type = "button";
      b.textContent = justCopied(m.otp) ? "Copied" : m.otp; b.title = "Copy";
      b.classList.toggle("copied", justCopied(m.otp));
      b.onclick = () => copy(m.otp);
      li.append(b);
    }
    const text = document.createElement("div"); text.className = "text"; text.textContent = m.body;
    li.append(text);
    return li;
  }));
  if (!data.messages.length) {
    const li = document.createElement("li"); li.className = "stamp"; li.textContent = "No messages in the last 7 days";
    list.append(li);
  }
}

async function poll() {
  const status = document.getElementById("status");
  // This is the browser's link to the server, not the phone's: worded so it can't be
  // read as the phone strip below.
  let r = null;
  try {
    // redirect: "manual": an expired login answers with a redirect to Kanidm. Caught
    // here as an opaque redirect, it can be told apart from the network being down.
    r = await fetch("/api/messages", { cache: "no-store", redirect: "manual" });
  } catch (e) { /* network down; r stays null */ }
  if (r && r.type === "opaqueredirect") {
    document.documentElement.dataset.connection = "offline";
    status.replaceChildren("Signed out · ", Object.assign(document.createElement("a"), { href: "/", textContent: "Sign in" }));
  } else if (r && r.ok) {
    data = await r.json(); lastOk = Date.now();
    document.documentElement.dataset.connection = "online";
    status.textContent = "Up to date";
  } else {
    document.documentElement.dataset.connection = "offline";
    status.textContent = "Can't reach server" + (lastOk ? " · last update " + ago(Date.now() - lastOk) : "");
  }
  render();
}

document.getElementById("latest").onclick = () => {
  const latest = data && data.messages.find(m => m.otp);
  if (latest) copy(latest.otp);
};
poll();
setInterval(() => { if (!document.hidden) poll(); }, 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
